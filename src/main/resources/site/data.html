<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#28422e">
    <meta name="description" content="PvZ TV 对战统计：卡组使用趋势、单卡表现与近期对局。">
    <title>对战大数据</title>
    <link rel="stylesheet" href="/site/data.css?v=pvz-release-20261106-3">
    <link rel="stylesheet" href="/site/common.css?v=pvz-release-20261105-3">
    <script src="/site/data.js?v=pvz-release-20261106-7" defer></script>
  </head>
  <body>
    <header class="global-header">
      <a class="global-brand" href="/" aria-label="返回 PvZ TV 首页"><strong>PvZ TV</strong><small>V3215</small></a>
      <nav class="global-nav" aria-label="主导航"><a href="/">首页</a><a href="#topTitle" aria-current="page">对战数据</a><a href="/almanac/" data-almanac-src="/almanac/">图鉴</a><a href="/#downloads">游戏下载</a></nav>
      <div class="header-tools"><button id="langBtn" type="button" aria-label="切换中英文">中文 / EN</button><button id="themeBtn" type="button" aria-label="切换明暗主题">◐</button></div>
    </header>
    <main class="data-page">
      <section class="data-banner" aria-labelledby="topTitle">
        <h1 id="topTitle">对战大数据</h1>
      </section>
      <section class="filter-bar" aria-label="对战数据筛选">
        <label class="filter-control"><span id="versionLabel">游戏版本</span><select id="versionSel"><option value="all">全部版本</option></select></label>
        <label class="filter-control"><span id="banLabel">禁选模式</span><select id="banSel"><option value="false">关闭</option><option value="true">开启</option></select></label>
        <label class="filter-control"><span id="extraLabel">额外卡槽</span><select id="extraSel"><option value="false">关闭</option><option value="true">开启</option></select></label>
        <label class="filter-control"><span id="mapLabel">地图</span><select id="modeSel"><option value="DAY">白天</option><option value="NIGHT">黑夜</option><option value="POOL">泳池白天</option><option value="FOG">泳池黑夜</option></select></label>
        <div class="side-switch" role="group" aria-label="对战阵营"><button id="sidePlant" type="button" aria-pressed="true">植物</button><button id="sideZombie" type="button" aria-pressed="false">僵尸</button></div>
      </section>
      <section class="stats-grid" aria-label="对战数据详情">
        <article id="deckSection" class="data-section deck-section">
          <div class="section-heading"><div><p class="section-kicker">POPULAR LINEUPS</p><h2 id="deckTitle">Top 10 卡组</h2></div><span id="deckCount" class="section-count">—</span></div>
          <div class="deck-content"><div class="chart-wrap"><canvas id="pie" hidden width="300" height="300" role="img" aria-label="Top 10 卡组使用次数图表"></canvas></div><ol id="deckList" class="deck-list" aria-label="卡组排行"></ol></div>
        </article>
        <article id="cardSection" class="data-section card-section">
          <div class="section-heading"><div><p class="section-kicker">SEED PERFORMANCE</p><h2 id="cardTitle">单卡统计</h2></div><span id="cardCount" class="section-count">—</span></div>
          <div id="cardsWrap" class="table-wrap"><table id="cards"><thead><tr><th id="thCard">卡牌</th><th id="thPick">选取</th><th id="thBan">禁用</th><th id="thWin">胜场</th><th id="thWr">胜率</th><th id="thPr">选取率</th><th id="thBr">禁用率</th></tr></thead><tbody></tbody></table><p class="empty-state" id="cardsEmpty" hidden>等待对局数据</p></div>
        </article>
        <article id="recentSection" class="data-section recent-section">
          <div class="section-heading"><div><p class="section-kicker">MATCH HISTORY</p><h2 id="recentTitle">最近对局</h2></div><span class="section-count">LATEST</span></div>
          <div id="recentWrap" class="table-wrap"><table id="recent"><thead><tr><th id="recentThTime">时间</th><th id="recentThPlant">植物</th><th id="recentThZombie">僵尸</th><th id="recentThWinner">胜方</th><th id="recentThDuration">时长</th></tr></thead><tbody></tbody></table><p class="empty-state" id="recentEmpty" hidden>等待对局数据</p></div>
        </article>
      </section>
      <footer class="data-footer"><span>PvZ TV · 对战统计</span><a href="/">返回资料站首页</a></footer>
    </main>
    <script>window.PVZ_DATA_PAGE = true;</script>
  </body>
</html>
