<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#a8632f">
    <meta name="description" content="PvZ TV 植物与僵尸卡牌图鉴，查看卡牌基础属性。">
    <title>植物图鉴 · PvZ TV</title>
    <style>
:root {
  color-scheme: light;
  --paper: #e9d2a0;
  --paper-light: #f4e7c6;
  --paper-shadow: #c79a5e;
  --wood: #73401f;
  --wood-dark: #482817;
  --wood-light: #a45d2c;
  --ink: #38271c;
  --muted: #785b40;
  --leaf: #397f32;
  --leaf-dark: #285a2a;
  --sun: #f5bf39;
  --line: #8b5a31;
  --stone: #43465b;
  --stone-light: #8c91b4;
  --zombie-green: #38ad35;
  --focus: #f7d04f;
  font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: #b67b42;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background-color: #c38a4b;
  background-image: url("../assets/site/ui/plant-background.webp");
  background-position: center top;
  background-size: cover;
  background-attachment: fixed;
}

button { font: inherit; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

.page-shell {
  width: min(1440px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  padding: 18px 22px 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.site-header {
  min-height: 96px;
  display: grid;
  grid-template-columns: 1fr minmax(250px, 560px) 1fr;
  align-items: center;
  gap: 16px;
}

.header-emblem {
  justify-self: start;
  width: 42px;
  height: 42px;
  border: 3px solid #5a2e1b;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #8fd65a 0 20%, #4a9f3f 22% 58%, #2b5d30 60% 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.45), 0 3px 2px rgba(61,31,15,.45);
  position: relative;
}

.header-emblem::before, .header-emblem::after, .header-emblem span {
  content: "";
  position: absolute;
  display: block;
  border-radius: 50%;
  background: #f5d65c;
  border: 1px solid #81501d;
}

.header-emblem::before { width: 9px; height: 9px; top: 9px; left: 12px; }
.header-emblem::after { width: 6px; height: 6px; top: 21px; left: 24px; }
.header-emblem span { width: 5px; height: 5px; top: 22px; left: 10px; }

.title-plank {
  min-height: 74px;
  padding: 9px 25px 8px;
  text-align: center;
  color: #f9e9c3;
  border: 3px solid #62391f;
  border-radius: 8px 5px 9px 5px;
  background:
    repeating-linear-gradient(177deg, transparent 0 9px, rgba(37, 20, 10, .09) 10px 11px),
    linear-gradient(180deg, #986037 0%, #734321 55%, #5a321d 100%);
  box-shadow: inset 0 2px 0 rgba(255,221,160,.34), inset 0 -4px 0 rgba(32,17,8,.24), 0 5px 2px rgba(73,39,17,.4);
  position: relative;
}

.title-plank::before, .title-plank::after {
  content: "";
  position: absolute;
  top: 11px;
  width: 8px;
  height: 45px;
  border: 1px solid rgba(50,27,15,.55);
  background: rgba(210,151,82,.2);
}
.title-plank::before { left: 8px; }
.title-plank::after { right: 8px; }

h1, h2, h3, p { margin-top: 0; }
h1 {
  margin: 0;
  font: 700 31px/1.1 Georgia, "Microsoft YaHei", serif;
  color: #fff0c9;
  text-shadow: 0 2px 0 #3c2417, 1px 3px 1px rgba(0,0,0,.45);
}

.header-stamp {
  justify-self: end;
  display: grid;
  gap: 4px;
  min-width: 92px;
  padding: 8px 11px;
  text-align: center;
  color: #f1dfb6;
  border: 2px solid #644129;
  border-radius: 4px;
  background: #3c3b35;
  box-shadow: 0 3px 1px rgba(70,39,17,.35);
}
.header-stamp span { font-size: 12px; }
.header-stamp b { color: #f3c84d; font: 700 12px Georgia, serif; }

.catalog-nav {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 9px;
  min-height: 52px;
  border: 2px solid #774322;
  border-radius: 6px;
  background: linear-gradient(180deg, rgba(249,231,189,.87), rgba(222,189,131,.91));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 3px 1px rgba(84,46,20,.25);
}

.category-button {
  min-width: 88px;
  min-height: 35px;
  padding: 5px 16px;
  color: #f7e5bd;
  font-weight: 700;
  border: 2px solid #59412c;
  border-radius: 4px;
  background: linear-gradient(#777b9b, #50536f);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 2px 0 #34364c;
  cursor: pointer;
}
.category-button.is-active {
  color: #ffe8aa;
  border-color: #7b3d1d;
  background: linear-gradient(#a95b29, #713318);
  box-shadow: inset 0 1px 0 rgba(255,211,131,.65), 0 2px 0 #4d2716;
}
.zombie-mode-switch {
  margin-left: auto;
  padding: 3px;
  display: flex;
  align-items: center;
  gap: 3px;
  border: 1px solid #74512f;
  border-radius: 4px;
  background: rgba(100, 71, 43, .15);
}
.zombie-mode-switch[hidden] { display: none; }
.zombie-mode-button {
  min-width: 52px;
  min-height: 32px;
  padding: 4px 9px;
  color: #674b31;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid transparent;
  border-radius: 3px;
  background: transparent;
  cursor: pointer;
}
.zombie-mode-button.is-active {
  color: #f8e9c5;
  border-color: #694221;
  background: linear-gradient(#9a5b2e, #6d3c20);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
}

.almanac-layout {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 354px;
  align-items: stretch;
  gap: 15px;
}

.catalog-area {
  min-width: 0;
  padding: 14px;
  border: 3px solid #875026;
  border-radius: 7px;
  background-color: rgba(240, 217, 168, .78);
  background-image: repeating-linear-gradient(0deg, rgba(102,68,34,.035) 0 1px, transparent 1px 7px);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.42), inset 0 -3px 0 rgba(87,49,22,.12), 0 4px 2px rgba(74,41,18,.25);
}

.section-heading {
  min-height: 53px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 11px;
  padding: 7px 13px;
  color: #f4e2b2;
  border: 2px solid #5a3420;
  border-radius: 5px;
  background: linear-gradient(180deg, #87532f, #61361f);
  box-shadow: inset 0 1px 0 rgba(255,226,168,.35), 0 2px 1px rgba(74,41,18,.27);
}
.section-kicker { margin: 0 0 2px; color: #d8b071; font-size: 12px; font-weight: 700; }
.section-heading h2 {
  margin: 0;
  color: #f5c852;
  font: 700 21px/1.15 Georgia, "Microsoft YaHei", serif;
  text-shadow: 0 1px #3c2417;
}
.count-ribbon {
  padding: 5px 9px;
  color: #3d2a1a;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid #7b5a34;
  border-radius: 3px;
  background: #e8ca83;
  white-space: nowrap;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
  align-items: start;
  gap: 10px 8px;
}

.almanac-card {
  min-width: 0;
  min-height: 148px;
  padding: 5px 5px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
  color: #3c2a1b;
  border: 2px solid #59603b;
  border-radius: 4px;
  background: linear-gradient(155deg, #e5db9b 0%, #bac478 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 2px 0 rgba(76,51,25,.28);
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.almanac-card:hover { transform: translateY(-2px); box-shadow: 0 4px 4px rgba(74,41,18,.24); }
.almanac-card.is-selected { border-color: #d58c20; box-shadow: 0 0 0 2px #f6d261, 0 3px 2px rgba(74,41,18,.3); }
.card-face {
  width: min(100%, 80px);
  aspect-ratio: 5 / 7;
  position: relative;
  display: block;
  flex: none;
}
.card-face img {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  image-rendering: auto;
}
.card-cost {
  position: absolute;
  left: 10%;
  bottom: 7%;
  width: 55%;
  height: 17%;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: #22291c;
  font-size: 11px;
  font-weight: 800;
  line-height: 1;
  text-shadow: 0 1px #fff;
  white-space: nowrap;
  pointer-events: none;
}
.card-name {
  width: 100%;
  min-height: 28px;
  display: grid;
  align-content: center;
  color: #3a2b1d;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.25;
  overflow-wrap: anywhere;
}
.detail-panel {
  min-width: 0;
  position: sticky;
  top: 18px;
  align-self: start;
  max-height: calc(100vh - 36px);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
  border: 3px solid #7e4c29;
  border-radius: 7px;
  background-color: #f0d6a4;
  background-image: repeating-linear-gradient(91deg, rgba(95,61,31,.035) 0 1px, transparent 1px 8px);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.5), inset 0 -3px 0 rgba(90,50,23,.12), 0 4px 2px rgba(74,41,18,.3);
}

.detail-heading {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px 9px;
  border: 2px solid #64391f;
  border-radius: 5px;
  background: linear-gradient(180deg, #9a572b, #6a381d);
  box-shadow: inset 0 1px 0 rgba(255,226,168,.35);
}
.detail-kicker { margin: 0 0 3px; color: #e5bf6d; font-size: 12px; font-weight: 700; }
.detail-heading h2 { margin: 0; color: #f6cb4e; font: 700 21px/1.2 Georgia, "Microsoft YaHei", serif; text-shadow: 0 1px #472818; }
.detail-en { margin: 3px 0 0; color: #e5d2aa; font-size: 12px; font-weight: 700; overflow-wrap: anywhere; }
.seed-id { color: #f3db9d; font: 700 12px Georgia, serif; white-space: nowrap; }

.detail-hero {
  display: grid;
  grid-template-columns: 112px minmax(0, 1fr);
  align-items: center;
  gap: 13px;
  padding: 8px 10px;
  border: 2px solid #865631;
  border-radius: 5px;
  background: linear-gradient(135deg, #d0b47a, #ecd9ac);
}
.detail-art-frame {
  width: 100%;
  aspect-ratio: 5 / 7;
  display: grid;
  place-items: center;
  padding: 4px;
  border: 2px solid #49543a;
  border-radius: 4px;
  background: #d4d89d;
  box-shadow: 0 2px 1px rgba(64,40,20,.25);
}
.detail-art-frame .card-face { width: 100%; height: 100%; }
.detail-art-frame .card-cost { font-size: 15px; }
.detail-headline-stats { display: grid; gap: 6px; }
.detail-headline-stats p {
  margin: 0;
  padding: 5px 7px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
  border-bottom: 1px solid rgba(93,61,34,.3);
  color: #62472d;
  font-size: 12px;
}
.detail-headline-stats b { color: var(--leaf-dark); font-size: 14px; font-weight: 800; text-align: right; }

.stat-section, .ability-section, .mechanism-section {
  padding: 10px 11px;
  border: 2px solid #9a7047;
  border-radius: 5px;
  background: rgba(255, 238, 198, .78);
}
.stat-section h3, .ability-section h3, .mechanism-section h3 { margin: 0 0 7px; color: #744321; font: 700 15px/1.2 Georgia, "Microsoft YaHei", serif; }
.stat-list { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 13px; }
body[data-category="zombies"] .stat-section { padding-left: 6px; padding-right: 6px; }
body[data-category="zombies"] .stat-list { column-gap: 8px; }
body[data-category="zombies"] .stat-row { gap: 4px; }
body[data-category="zombies"] .stat-row dt { white-space: nowrap; }
.stat-row {
  min-width: 0;
  min-height: 31px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  border-bottom: 1px solid rgba(112,75,40,.2);
  font-size: 12px;
}
.stat-row dt { color: #725235; }
.stat-row dd { margin: 0; color: #2e622d; font-weight: 700; text-align: right; overflow-wrap: anywhere; }
.attack-line { margin: 0 0 5px; color: #2f6732; font-size: 13px; font-weight: 700; line-height: 1.45; }
.ability-copy { margin: 0; color: #654b32; font: 14px/1.55 Georgia, "Microsoft YaHei", serif; overflow-wrap: anywhere; }
.close-detail { display: none; }

.variant-list {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.variant-list[hidden] { display: none; }
.variant-label { margin-right: 4px; color: #67492c; font-size: 12px; font-weight: 700; }
.variant-button {
  min-width: 35px;
  min-height: 30px;
  color: #f5e8c5;
  border: 2px solid #4c4d62;
  border-radius: 3px;
  background: #737997;
  cursor: pointer;
}
.variant-button.is-active { color: #fff1bb; border-color: #80502e; background: #a35d2d; }

.site-footer {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 2px 4px;
  color: #64472a;
  font-size: 12px;
}
.site-footer span:last-child { text-align: right; }

body[data-category="zombies"] .detail-panel { border-color: #565872; background-color: #d0c5de; }
body[data-category="zombies"] .catalog-area { border-color: #575972; background-color: rgba(196,194,218,.88); }
body[data-category="zombies"] .section-heading { border-color: #45475e; background: linear-gradient(#777d9e, #4e526f); }
body[data-category="zombies"] .section-heading h2 { color: var(--zombie-green); }
body[data-category="zombies"] .detail-heading { border-color: #46485f; background: linear-gradient(#7f83a5, #50546f); }
body[data-category="zombies"] .detail-heading h2 { color: var(--zombie-green); }
body[data-category="zombies"] .detail-hero { border-color: #686d8d; background: linear-gradient(135deg, #b1aacd, #ded5e7); }
body[data-category="zombies"] .almanac-card { border-color: #666984; background: linear-gradient(155deg, #c8c7df, #9e9fbe); }
body[data-category="zombies"] .almanac-card.is-selected { border-color: #d58c20; }
body[data-category="zombies"] .detail-headline-stats b,
body[data-category="zombies"] .stat-row dd,
body[data-category="zombies"] .attack-line { color: #317f36; }
body[data-category="zombies"] .stat-section, body[data-category="zombies"] .ability-section, body[data-category="zombies"] .mechanism-section { border-color: #8884a5; background: rgba(239,233,246,.88); }

@media (max-width: 900px) {
  .page-shell { padding: 12px 13px 10px; gap: 10px; }
  .almanac-layout { grid-template-columns: minmax(0, 1fr) 320px; gap: 10px; }
  .catalog-area, .detail-panel { padding: 10px; }
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 7px 6px; }
  .almanac-card { min-height: 132px; }
  .almanac-card .card-face { width: min(100%, 70px); }
}

@media (max-width: 700px) and (orientation: portrait), (max-width: 700px) {
  .page-shell { min-height: 100svh; padding: 9px 9px calc(12px + env(safe-area-inset-bottom)); gap: 8px; }
  .site-header { min-height: 63px; grid-template-columns: 36px minmax(0, 1fr) 62px; gap: 7px; }
  .header-emblem { width: 32px; height: 32px; border-width: 2px; }
  .header-emblem::before { width: 7px; height: 7px; top: 6px; left: 9px; }
  .header-emblem::after { width: 5px; height: 5px; top: 17px; left: 19px; }
  .header-emblem span { width: 4px; height: 4px; top: 17px; left: 8px; }
  .title-plank { min-height: 58px; padding: 6px 14px; }
  .title-plank::before, .title-plank::after { top: 8px; height: 36px; }
  h1 { font-size: 23px; }
  .edition { font-size: 12px; }
  .header-stamp { min-width: 0; padding: 5px 4px; }
  .header-stamp span { font-size: 12px; }
  .header-stamp b { font-size: 12px; }
  .catalog-nav { min-height: 45px; gap: 6px; padding: 5px; }
  .category-button { min-width: 72px; min-height: 33px; padding: 4px 10px; font-size: 13px; }
  .catalog-nav p { padding-right: 3px; font-size: 12px; }
  .almanac-layout { display: block; }
  .catalog-area { padding: 8px; border-width: 2px; }
  .section-heading { min-height: 52px; margin-bottom: 8px; padding: 6px 9px; }
  .section-heading h2 { font-size: 18px; }
  .section-kicker { font-size: 12px; }
  .count-ribbon { padding: 4px 7px; font-size: 12px; }
  .card-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px 5px; }
  .almanac-card { min-height: 146px; padding: 4px 3px 5px; gap: 3px; }
  .almanac-card .card-face { width: min(100%, 70px); }
  .card-name { min-height: 30px; font-size: 12px; }
  .almanac-card .card-cost { font-size: 10px; }
  .detail-panel {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 5;
    width: 100%;
    height: 100%;
    height: 100dvh;
    max-height: none;
    align-self: auto;
    padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    overflow-y: auto;
    border: 0;
    border-radius: 0;
    gap: 9px;
  }
  body.details-open { overflow: hidden; }
  body.details-open .detail-panel { display: flex; }
  .close-detail {
    align-self: flex-start;
    min-height: 34px;
    display: inline-flex;
    align-items: center;
    padding: 5px 11px;
    color: #f7e7c4;
    font-weight: 700;
    border: 2px solid #64391f;
    border-radius: 4px;
    background: #81502d;
    cursor: pointer;
  }
  .detail-heading { padding: 8px 10px; }
  .detail-heading h2 { font-size: 20px; }
  .detail-hero { grid-template-columns: 96px minmax(0, 1fr); gap: 10px; }
  .detail-headline-stats { gap: 3px; }
  .detail-headline-stats p { padding: 4px 5px; font-size: 12px; }
  .stat-section, .ability-section, .mechanism-section { padding: 8px 9px; }
  .stat-section h3, .ability-section h3, .mechanism-section h3 { font-size: 14px; }
  .stat-list { grid-template-columns: 1fr; }
  .stat-row { min-height: 32px; font-size: 12px; }
  .ability-copy { font-size: 13px; }
  .data-note { font-size: 12px; }
  .site-footer { font-size: 12px; }
}

@media (max-width: 370px) and (orientation: portrait) {
  .card-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .catalog-nav p { max-width: 130px; text-align: right; }
}

@media (max-width: 900px) and (orientation: landscape) {
  .page-shell { min-height: 100svh; padding: 5px 9px; gap: 5px; }
  .site-header { min-height: 49px; grid-template-columns: 28px minmax(0, 1fr) 67px; gap: 8px; }
  .header-emblem { width: 27px; height: 27px; }
  .title-plank { min-height: 43px; padding: 3px 13px; }
  .title-plank::before, .title-plank::after { top: 4px; height: 28px; }
  h1 { font-size: 19px; }
  .edition { font-size: 12px; margin-bottom: 0; }
  .header-stamp { padding: 3px 5px; }
  .header-stamp span { font-size: 12px; }
  .header-stamp b { font-size: 12px; }
  .catalog-nav { min-height: 36px; padding: 3px 5px; gap: 5px; }
  .category-button { min-height: 30px; min-width: 66px; padding: 2px 8px; font-size: 12px; }
  .catalog-nav p { font-size: 12px; }
  .almanac-layout { grid-template-columns: minmax(0, 1.12fr) minmax(275px, .88fr); gap: 7px; }
  .catalog-area, .detail-panel { padding: 7px; border-width: 2px; }
  .section-heading { min-height: 35px; margin-bottom: 5px; padding: 3px 7px; }
  .section-heading h2 { font-size: 15px; }
  .section-kicker { display: none; }
  .count-ribbon { font-size: 12px; padding: 3px 6px; }
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 4px; }
  .almanac-card { min-height: 126px; padding: 2px; gap: 2px; }
  .almanac-card .card-face { width: min(100%, 49px); }
  .card-name { min-height: 30px; font-size: 12px; }
  .almanac-card .card-cost { font-size: 8px; }
  .detail-panel { gap: 6px; overflow-y: auto; }

<script>
const catalog = window.PVZ_CATALOG;
const grid = document.getElementById("catalog-grid");
const detailPanel = document.getElementById("detail-panel");
const closeDetail = document.getElementById("close-detail");
const selectedIds = { plants: 0, zombies: 62 };
const variantIndex = { 91: 0 };
const oneTimePlantIds = new Set([2, 4, 12, 14, 15, 17, 19, 20, 27, 35, 200, 206, 207]);
const specialMechanisms = {
  plants: {
    11: "吞噬二级及以上的召唤墓碑需要消耗 2 个墓碑吞。",
    18: "位于第一路或第五路时，会额外发射一颗豌豆。",
    200: "场上有多只僵尸时，会优先冻结火把僵尸。",
    201: "每轮最多锁定 3 个目标，同一目标去程、回程各受 20 点伤害。",
    211: "最多额外连锁 4 个目标（必须确保每个目标要在以一个受连锁目标为中心的 3×3 范围内）。"
  },
  zombies: {
    89: "本体生命值降至 135 以下时，会碾压植物。",
    93: "倒计时结束后（约走至第三列），接触植物时会自爆，造成 301 点伤害。",
    94: "入场 18 秒后复活阵亡的僵尸，每行最多 3 只。复活后的本体为满血的 2/3，防具为满血的 1/2。复活过的单位不会再次复活。",
    106: "僵尸鸽子生命值 25 ，飞行时免疫平射子弹。"
  }
};
let category = "plants";
let returnFocus = null;

function imagePath(card, selectedVariant = 0) {
  const file = card.variants
    ? `SEED_PACKET_${card.id}_MOUND_LEVEL_${selectedVariant}`
    : `SEED_PACKET_${String(card.id).padStart(2, "0")}`;
  return `../assets/cards/${file}.webp`;
}

function currentItems() {
  return catalog[category];
}

function getSelected() {
  return currentItems().find((card) => card.id === selectedIds[category]) || currentItems()[0];
}

function getCardName(card) {
  return window.PVZ_GAME_STRINGS?.[card.en]?.name || card.name;
}

function getCardDescription(card) {
  return window.PVZ_GAME_STRINGS?.[card.en]?.description || "";
}

function getSpecialMechanism(card) {
  return specialMechanisms[category][card.id] || "";
}

function addText(parent, tag, className, content) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  element.textContent = content;
  parent.append(element);
  return element;
}

function formatNumber(value) {
  return Number.isInteger(value) ? String(value) : value.toFixed(1).replace(/\.0$/, "");
}

function getCardState(card) {
  return catalog.cardStates[card.id]?.[variantIndex[card.id] || 0];
}

function getDps(card) {
  const profile = getCardState(card)?.dps || catalog.dpsProfiles[card.id];
  if (!profile) return null;
  const hits = Array.isArray(profile.damage) ? profile.damage : [profile.damage];
  const intervals = Array.isArray(profile.interval) ? profile.interval : [profile.interval];
  const hitsPerTarget = profile.hitsPerTarget ?? 1;
  const expectedDamage = profile.probabilities
    ? hits.reduce((sum, damage, index) => sum + damage * profile.probabilities[index], 0)
    : hits.reduce((sum, damage) => sum + damage, 0) / hits.length;
  const averageInterval = intervals.reduce((sum, interval) => sum + interval, 0) / intervals.length;
  const dps = expectedDamage * hitsPerTarget / averageInterval;
  const peaInterval = catalog.dpsProfiles[0].interval;
  const peaDps = catalog.dpsProfiles[0].damage / (Array.isArray(peaInterval) ? (peaInterval[0] + peaInterval[1]) / 2 : peaInterval);
  return {
    value: formatNumber(dps),
    ratio: Number((dps / peaDps).toFixed(2)).toString()
  };
}

function getCardCostLabel(card) {
  if (category === "plants") {
    const cost = getPlantSun(card);
    return cost === "复制目标" ? "复制" : String(cost);
  }
  const cost = getZombieCost(card);
  if (cost !== null) return String(cost);
  return card.id === 91 ? "满级" : "—";
}

function addCardFace(parent, card, costLabel, selectedVariant = 0, imageId = "") {
  parent.replaceChildren();
  const face = addText(parent, "span", "card-face", "");
  const image = document.createElement("img");
  if (imageId) image.id = imageId;
  image.alt = `${getCardName(card)}卡图`;
  image.loading = imageId ? "eager" : "lazy";
  image.decoding = "async";
  image.width = 200;
  image.height = 280;
  image.src = imagePath(card, selectedVariant);
  face.append(image);
  addText(face, "span", "card-cost", costLabel);
  return image;
}

function renderGrid() {
  grid.replaceChildren();
  for (const card of currentItems()) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "almanac-card";
    button.dataset.cardId = String(card.id);
    button.classList.toggle("is-selected", card.id === selectedIds[category]);
    button.setAttribute("aria-pressed", String(card.id === selectedIds[category]));
    button.setAttribute("aria-label", `${card.name}，查看${category === "plants" ? "植物" : "僵尸"}资料`);

    addCardFace(button, card, getCardCostLabel(card), variantIndex[card.id] || 0);
    addText(button, "span", "card-name", getCardName(card));
    button.addEventListener("click", () => selectCard(card));
    grid.append(button);
  }
}

function updateGridSelection(card, updateFace = false) {
  for (const button of grid.children) {
    const active = button.dataset.cardId === String(card.id);
    button.classList.toggle("is-selected", active);
    button.setAttribute("aria-pressed", String(active));
    if (active && updateFace) {
      button.querySelector("img").src = imagePath(card, variantIndex[card.id] || 0);
      button.querySelector(".card-cost").textContent = getCardCostLabel(card);
    }
  }
}

function addStat(rows, label, value) {
  const row = document.createElement("div");
  row.className = "stat-row";
  addText(row, "dt", "", label);
  addText(row, "dd", "", value ?? "—");
  rows.append(row);
}

function renderVariants(card) {
  const list = document.getElementById("variant-list");
  list.replaceChildren();
  const states = catalog.cardStates[card.id];
  const variants = states || card.variants;
  if (!variants) {
    list.hidden = true;
    return;
  }
  list.hidden = false;
  const label = states ? category === "plants" ? "植物状态" : "僵尸状态" : "墓堆等级";
  addText(list, "span", "variant-label", label);
  variants.forEach((variant, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "variant-button";
    const active = (variantIndex[card.id] || 0) === index;
    button.classList.toggle("is-active", active);
    button.setAttribute("aria-pressed", String(active));
    button.textContent = states ? variant.label : String(variant + 1);
    button.setAttribute("aria-label", `${label} ${button.textContent}`);
    button.addEventListener("click", () => {
      variantIndex[card.id] = index;
      updateGridSelection(card, true);
      renderDetail();
      list.querySelectorAll("button")[index].focus();
    });
    list.append(button);
  });
}

function renderDetail() {
  const card = getSelected();
  if (!card) return;
  const isPlant = category === "plants";
  const id = card.id < 10 ? String(card.id).padStart(2, "0") : String(card.id);
  document.getElementById("detail-kicker").textContent = `${isPlant ? "植物卡" : "僵尸卡"} · ${id}`;
  document.getElementById("detail-name").textContent = getCardName(card);
  document.getElementById("detail-en").textContent = card.en;
  document.getElementById("detail-id").textContent = `#${card.id}`;

  addCardFace(
    document.getElementById("detail-art-frame"),
    card,
    getCardCostLabel(card),
    variantIndex[card.id] || 0,
    "detail-art"
  );

  const cardState = getCardState(card);
  const zombieStats = !isPlant ? catalog.zombieStats[card.id] : null;
  const zombieSpeed = !isPlant ? cardState?.speed || catalog.zombieSpeeds[card.id] : null;
  const zombieMound = !isPlant && card.id === 91 ? catalog.zombieMoundProfiles[variantIndex[card.id] || 0] : null;
  const zombieCost = !isPlant ? getZombieCost(card) : null;
  const health = zombieStats ? getZombieHealth(card, zombieStats) : null;
  const dps = isPlant ? getDps(card) : null;
  const production = catalog.productionProfiles[category][card.id];
  document.getElementById("detail-cost-label").textContent = isPlant ? "阳光花费" : "脑光花费";
  document.getElementById("detail-cost-value").textContent = isPlant
    ? String(getPlantSun(card))
    : card.id === 91
      ? zombieCost === null ? "已满级" : String(zombieCost)
      : zombieCost === null ? "未收录" : String(zombieCost);
  document.getElementById("detail-recharge").textContent = isPlant
    ? getPlantRecharge(card)
    : catalog.zombieRecharges?.[card.id] ?? "未收录";
  const openingRecharge = getOpeningRecharge(card);
  document.getElementById("detail-opening-recharge").textContent = openingRecharge === null
    ? "未收录"
    : `${formatNumber(openingRecharge)} 秒`;
  const suddenDeathRecharge = catalog.suddenDeathRecharges[card.id];
  document.getElementById("detail-sudden-death-recharge").textContent = suddenDeathRecharge === null
    ? "停用"
    : suddenDeathRecharge === undefined ? "未收录" : `${formatNumber(suddenDeathRecharge)} 秒`;

  const stats = document.getElementById("stat-list");
  stats.replaceChildren();
  if (isPlant) {
    const damage = cardState?.damage ?? card.damage;
    if (damage && damage !== "无直接伤害" && damage !== "不攻击僵尸") {
      addStat(stats, /\d/.test(damage) || card.singleDamage !== undefined || dps ? "伤害" : "效果", damage);
    }
    if (dps) addStat(stats, "每秒伤害", `${dps.value}（${dps.ratio} 豆）`);
    if (oneTimePlantIds.has(card.id)) {
      addStat(stats, "用法", "一次性");
    } else if (card.attackInterval !== "—" && !/一次性|触发后一次|触发后生效|被吃后触发|布置后启动|产阳|产币|自动拾取|按目标触发|受攻击触发|复制目标/.test(card.attackInterval)) {
      addStat(stats, "攻击间隔", card.attackInterval);
    }
    addStat(stats, "生命值", cardState?.health ?? card.health);
  } else {
    addStat(stats, "生命值", health ?? "未收录");
    if (zombieStats?.health?.armor) addStat(stats, "防具强度", zombieStats.health.armor);
    const zombieDps = getZombieDps(card);
    if (zombieDps !== null) addStat(stats, "每秒伤害", zombieDps);
    if (zombieStats?.healingPerSecond !== undefined) addStat(stats, "每秒治疗", formatNumber(zombieStats.healingPerSecond));
    if (zombieStats?.attackInterval) addStat(stats, "攻击间隔", zombieStats.attackInterval);
    if (zombieSpeed?.phases) {
      for (const phase of zombieSpeed.phases) {
        addStat(stats, phase.label, phase.unit ? `${phase.value} ${phase.unit}` : phase.value);
      }
    } else if (zombieSpeed) {
      addStat(stats, "速度", [zombieSpeed.value, zombieSpeed.unit].filter(Boolean).join(" "));
    }
    if (zombieSpeed?.note) addStat(stats, "速度变化", zombieSpeed.note);
    if (zombieMound) {
      addStat(stats, "召唤单位", zombieMound.summon);
      addStat(stats, "首次召唤", zombieMound.firstInterval);
      addStat(stats, "后续间隔", zombieMound.interval);
    }
  }
  if (production) {
    addStat(stats, isPlant ? "阳光生产间隔" : "脑光生产间隔", production.interval);
    const amount = production.amount || production.amounts?.[variantIndex[card.id] || 0];
    if (amount) addStat(stats, isPlant ? "单次阳光产量" : "单次脑光产量", amount);
  }
  document.getElementById("ability-title").textContent = "描述";
  document.getElementById("detail-attack").hidden = true;
  document.getElementById("detail-attack").textContent = "";
  document.getElementById("detail-ability").textContent = getCardDescription(card);
  const mechanism = getSpecialMechanism(card);
  document.getElementById("detail-mechanism").textContent = mechanism;
  document.getElementById("mechanism-section").hidden = !mechanism;
  renderVariants(card);
}

function getZombieDps(card) {
  const damagePerSecond = catalog.zombieStats[card.id]?.damagePerSecond;
  if (damagePerSecond !== undefined) return formatNumber(damagePerSecond);
  const profile = catalog.zombieEatProfiles[card.id];
  if (profile === null) return null;
  if (!profile) return `${catalog.zombieEatDpsBase}（啃食）`;
  return profile.map(({ multiplier, state }) =>
    `${formatNumber(catalog.zombieEatDpsBase * multiplier)}（${state}）`
  ).join(" / ");
}

function getZombieCost(card) {
  if (card.id === 91) {
    const moundCosts = [50, 100, 200, 300, 450];
    return moundCosts[variantIndex[card.id] || 0];
  }
  return catalog.zombieCosts[card.id] ?? null;
}

function getPlantSun(card) {
  return card.sun === null ? "复制目标" : catalog.plantCosts[card.id] ?? card.sun;
}

function getPlantRecharge(card) {
  return catalog.plantRecharges[card.id] ?? card.recharge;
}

function getOpeningRecharge(card) {
  const group = category === "plants" ? "plants" : "zombies";
  const overrides = catalog.openingRechargeOverrides[group];
  if (Object.hasOwn(overrides, card.id)) return overrides[card.id];
  const rechargeText = category === "plants" ? getPlantRecharge(card) : catalog.zombieRecharges?.[card.id];
  const recharge = Number.parseFloat(rechargeText);
  return catalog.openingRechargeDefaults[String(recharge)] ?? null;
}

function getZombieHealth(card, stats) {
  const health = stats.health;
  if (card.id === 91) return health.levels[variantIndex[card.id] || 0];
  return getCardState(card)?.health ?? health.value;
}

function renderCategory() {
  const isPlant = category === "plants";
  document.body.dataset.category = category;
  document.getElementById("catalog-title").textContent = isPlant ? "图鉴 — 植物" : "图鉴 — 僵尸";
  document.getElementById("card-count").textContent = `${currentItems().length} 张`;
  for (const button of document.querySelectorAll(".category-button")) {
    const active = button.dataset.category === category;
    button.classList.toggle("is-active", active);
    button.setAttribute("aria-pressed", String(active));
  }
  renderGrid();
  renderDetail();
}

function selectCard(card) {
  selectedIds[category] = card.id;
  updateGridSelection(card);
  renderDetail();
  if (window.matchMedia("(max-width: 700px)").matches) {
    returnFocus = grid.querySelector(`[data-card-id="${card.id}"]`);
    detailPanel.setAttribute("role", "dialog");
    detailPanel.setAttribute("aria-modal", "true");
    document.body.classList.add("details-open");
    closeDetail.focus();
  }
}

function closeMobileDetail() {
  document.body.classList.remove("details-open");
  detailPanel.removeAttribute("aria-modal");
  detailPanel.setAttribute("role", "complementary");
  if (returnFocus?.isConnected) returnFocus.focus();
  returnFocus = null;
}

for (const button of document.querySelectorAll(".category-button")) {
  button.addEventListener("click", () => {
    if (document.body.classList.contains("details-open")) closeMobileDetail();
    category = button.dataset.category;
    renderCategory();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

closeDetail.addEventListener("click", closeMobileDetail);
detailPanel.addEventListener("click", (event) => {
  if (event.target === detailPanel && document.body.classList.contains("details-open")) closeMobileDetail();
});
document.addEventListener("keydown", (event) => {
  if (!document.body.classList.contains("details-open")) return;
  if (event.key === "Escape") {
    closeMobileDetail();
    return;
  }
  if (event.key === "Tab") {
    const focusable = [...detailPanel.querySelectorAll("button:not([disabled])")];
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }
});

const homeUrl = location.protocol === "file:"
  ? "http://154.219.106.185:48080/"
  : location.pathname.startsWith("/almanac/") ? "/" : "./";
for (const link of document.querySelectorAll("[data-home-link]")) link.href = homeUrl;
document.querySelector("[data-download-link]").href = `${homeUrl}#downloads`;
document.querySelector("[data-data-link]").href = location.protocol === "file:" || location.hostname.endsWith("github.io")
  ? "http://154.219.106.185:48080/data/" : "/data/";
renderCategory();
const preloadBackground = new Image();
preloadBackground.src = "../assets/site/ui/zombie-background.webp";

</script>
